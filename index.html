
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARLEY STORE</title>
  <style>
    body { font-family: Arial; margin: 16px; background: #f5f5f5; }
    h1 { text-align: center; }
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
    }
    .item { background: white; padding: 10px; border-radius: 10px; }
    .item img { width: 100%; height: 150px; object-fit: cover; }
    .price { font-weight: bold; color: #087b43; }
  </style>
</head>
<body>
  <h1>MARLEY STORE</h1>
  <p>Clothes | Shoes | Gadgets</p>
  <h3>Products for sale</h3>
  <div id="status">Loading products...</div>
  <div id="products"></div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, collection, getDocs }
      from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDWU-i3pZKnRrT7iAL8HWqTu9jvNtrVMtg",
      authDomain: "marley-store-2c77e.firebaseapp.com",
      projectId: "marley-store-2c77e",
      storageBucket: "marley-store-2c77e.firebasestorage.app",
      messagingSenderId: "753148376121",
      appId: "1:753148376121:web:e23e19324ea28a630209e8",
      measurementId: "G-F80JYZN6RP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProducts() {
      const status = document.getElementById("status");
      const container = document.getElementById("products");

      try {
        const snapshot = await getDocs(collection(db, "products"));
        container.replaceChildren();

        if (snapshot.empty) {
          status.textContent = "No products found yet.";
          return;
        }

        snapshot.forEach((doc) => {
          const p = doc.data();
          const card = document.createElement("div");
          card.className = "item";

          if (p.imageUrl) {
            const img = document.createElement("img");
            img.src = p.imageUrl;
            img.alt = p.name || "Product";
            card.appendChild(img);
          }

          const name = document.createElement("h3");
          name.textContent = p.name || p.title || "Product";
          card.appendChild(name);

          const price = document.createElement("p");
          price.className = "price";
          price.textContent = p.price != null
            ? "MWK " + p.price : "Price not provided";
          card.appendChild(price);

          const category = document.createElement("p");
          category.textContent = p.category || "";
          card.appendChild(category);

          container.appendChild(card);
        });

        status.textContent = "";
      } catch (error) {
        console.error(error);
        status.textContent =
          "Could not load products. Check Firestore settings and rules.";
      }
    }

    loadProducts();
  </script>
</body>
</html>
