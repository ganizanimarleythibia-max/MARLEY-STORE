<!DOCTYPE html>
<html lang="ny">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARLEY-STORE | Marketplace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            color: #333;
        }
        header {
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff6600;
        }
        .logo span {
            color: #222;
        }
        .hero {
            background: linear-gradient(135deg, #fff5ec, #ffe6d5);
            padding: 30px 20px;
            border-radius: 12px;
            margin: 20px;
            text-align: left;
        }
        .hero h1 {
            font-size: 26px;
            color: #222;
            margin-bottom: 10px;
        }
        .hero p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .form-container {
            background: white;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            margin: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-container h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #222;
        }
        .form-container p {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .product-list {
            margin: 20px;
        }
        .product-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .product-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .product-info .price {
            color: #ff6600;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MARLEY <span>STORE</span></div>
    </header>

    <div class="hero">
        <h1>Find products. Sell with MARLEY STORE.</h1>
        <p>A marketplace for sharing products, prices and details with customers.</p>
        <a href="#submit-section" class="btn-primary">+ Add your product</a>
    </div>

    <!-- FOMU YOTUMIZIRA KATUNDU (SUBMIT PRODUCT) -->
    <div class="form-container" id="submit-section">
        <h2>Submit a product</h2>
        <p>Add a clear photo, product name, price and description.</p>
        
        <form id="productForm">
            <div class="form-group">
                <label>Product photo (camera or gallery)</label>
                <input type="file" id="prodImage" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Item name</label>
                <input type="text" id="prodName" placeholder="e.g. Nike Sneakers / Samsung Phone" required>
            </div>

            <div class="form-group">
                <label>Price (MWK)</label>
                <input type="text" id="prodPrice" placeholder="e.g. 35,000" required>
            </div>

            <div class="form-group">
                <label>Description / Details</label>
                <textarea id="prodDesc" rows="3" placeholder="Ikani ma details a katundu pano..."></textarea>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">Tumiza pa WhatsApp (Order)</button>
        </form>
    </div>

    <script>
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let name = document.getElementById('prodName').value;
            let price = document.getElementById('prodPrice').value;
            let desc = document.getElementById('prodDesc').value;
            
            let whatsappUrl = `https://wa.me/265995481970?text=Bwana%20ndikufuna%20kugula%20izi:%0A*Katundu:*%20${encodeURIComponent(name)}%0A*Mtengo:*%20MWK%20${encodeURIComponent(price)}%0A*Details:*%20${encodeURIComponent(desc)}`;
            
            window.open(whatsappUrl, '_blank');
        });
    </script>

</body>
</html>
