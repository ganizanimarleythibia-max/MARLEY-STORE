<!DOCTYPE html>
<html lang="ny">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARLEY-STORE | Online Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #232f3e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .category-title {
            border-bottom: 2px solid #232f3e;
            padding-bottom: 5px;
            margin-top: 30px;
            color: #232f3e;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }
        .price {
            color: #d9534f;
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
            width: 80%;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #ddd;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MARLEY-STORE</h1>
        <p>Gula Nsapato, Mafoni ndi Zovala mwachangu pa WhatsApp!</p>
    </header>

    <div class="container">

        <!-- CATEGORY: SNEAKERS -->
        <h2 class="category-title">👟 Sneaker Shoes</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="sneaker.jpg" alt="Sneakers" onerror="this.src='https://via.placeholder.com/200?text=Sneaker+Shoes'">
                <h3>Sneaker Shoes</h3>
                <div class="price">MWK 35,000</div>
                <a href="https://wa.me/265995481970?text=Bwana%20ndikufuna%20kugula%20Sneaker%20Shoes" class="btn-whatsapp" target="_blank">Gula pa WhatsApp</a>
            </div>
        </div>

        <!-- CATEGORY: MAFONI -->
        <h2 class="category-title">📱 Smart Phones</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="phone.jpg" alt="Smart Phone" onerror="this.src='https://via.placeholder.com/200?text=Smart+Phone'">
                <h3>Smart Phone</h3>
                <div class="price">MWK 120,000</div>
                <a href="https://wa.me/265995481970?text=Bwana%20ndikufuna%20kugula%20Smart%20Phone" class="btn-whatsapp" target="_blank">Gula pa WhatsApp</a>
            </div>
        </div>

        <!-- CATEGORY: ZOVALA -->
        <h2 class="category-title">👕 Zovala (Clothes)</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="shirt.jpg" alt="Zovala" onerror="this.src='https://via.placeholder.com/200?text=Clothes'">
                <h3>Zovala Zamakono</h3>
                <div class="price">MWK 20,000</div>
                <a href="https://wa.me/265995481970?text=Bwana%20ndikufuna%20kugula%20Zovala" class="btn-whatsapp" target="_blank">Gula pa WhatsApp</a>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 MARLEY-STORE. All rights reserved.</p>
    </footer>

</body>
</html>
