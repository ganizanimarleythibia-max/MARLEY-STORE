<!DOCTYPE html>
<html lang="ny">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARLEY-STORE | Online Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #232f3e;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        .price {
            color: #d9534f;
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #ddd;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MARLEY-STORE</h1>
        <p>Gula ndi kuitanitsa katundu mwachangu pa intaneti</p>
    </header>

    <div class="container">
        <h2>Katundu Wathu</h2>
        <div class="product-grid">

            <!-- Chinthu Choyamba -->
            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Chinthu 1">
                <h3>Dzina la Chinthu 1</h3>
                <p>Ndalama:</p>
                <div class="price">MWK 15,000</div>
                <!-- Sinthani nambala ya WhatsApp pansi pano (chotsani + kapena 0 koyambirira, mfano: 265XXXXXXXXX) -->
                <a href="https://wa.me/265999000000?text=Sogolo%20ndikufuna%20gula%20Chinthu%201" class="btn-whatsapp" target="_blank">Gula pa WhatsApp</a>
            </div>

            <!-- Chinthu Chachiwiri -->
            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Chinthu 2">
                <h3>Dzina la Chinthu 2</h3>
                <p>Ndalama:</p>
                <div class="price">MWK 25,000</div>
                <a href="https://wa.me/265999000000?text=Sogolo%20ndikufuna%20gula%20Chinthu%202" class="btn-whatsapp" target="_blank">Gula pa WhatsApp</a>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 MARLEY-STORE. Ufulu wonse ndi wotetezedwa.</p>
    </footer>

</body>
</html>
