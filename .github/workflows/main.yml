name: Build MARLEY-STORE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android app
        run: |
          cordova create /tmp/marley-store com.marley.store "MARLEY STORE"
          cd /tmp/marley-store
          cordova platform add android

      - name: Copy website files
        run: |
          cd /tmp/marley-store
          rm -rf www
          mkdir www
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='platforms' --exclude='plugins' --exclude='apk-output' "$GITHUB_WORKSPACE/" www/

      - name: Build APK
        run: |
          cd /tmp/marley-store
          cordova build android --debug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/MARLEY-STORE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MARLEY-STORE-APK
          path: apk-output/MARLEY-STORE.apk
          if-no-files-found: error
